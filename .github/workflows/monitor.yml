name: monitor-and-update

on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write # 自动更新 README 徽章日期需要提交
  issues: write # 发现停滞仓库时开 issue 提醒

concurrency:
  group: monitor-and-update
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run monitor
        run: python scripts/monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_TODAY: ${{ steps.date.outputs.today }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: weekly monitor refresh (stars/activeness check)"
            git push
          fi
